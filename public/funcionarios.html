<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <title>Página Funcionários - EasyRail</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg  p-2" id="navbar">
            <a class="navbar-brand" href="main.html">
                <img src="../assets/images/logo-navbar.png" alt="EasyRail Logo" width="45px" height="45px">
                EasyRail
            </a>
            <div class="collapse navbar-collapse d-flex justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Frota de Carga</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Sensores IoT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Relatórios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="funcionarios.html">Funcionários</a>
                    </li>
                </ul>
            </div>
            <a class="navbar-brand" href="../index.html">Sair</a>
        </nav>
    </header>


    <h1 class="titulo-cadastro fw-bold"> Cadastro de Funcionário</h1>

    <main id="body-index" class="text-black">



        <div class="d-flex">
            <div class="col-10  col-md-4 col-lg-3 px-4">

                <div class="cadastro card shadow p-3">
                    <div class="card-body">

                        <form id="form-cadastro" class="row g-3">
                            <h2 id="titulo" class="text-center fw-bold"></h2>

                            <div class="mb-2">
                                <label for="nome" class="form-label fw-bold ">Nome Usuário</label>
                                <input type="text" class="form-control borda-cadastro" id="nome" required>
                            </div>

                            <div class="mb-2">
                                <label for="senha" class="form-label fw-bold">Email Institucional </label>
                                <input type="email" class="form-control borda-cadastro" id="email" required>
                            </div>

                            <div class="mb-2">
                                <label for="email" class="form-label fw-bold">Senha Funcionário</label>
                                <input type="password" class="form-control borda-cadastro" id="senha" required>
                            </div>

                            <div class="mb-2">
                                <label for="setor" class="form-label fw-bold">Setor</label>
                                <select name="Setor" class="form-control borda-cadastro" id="setor" required>

                                    <option selected>Gestão</option>
                                    <option value="1">Chefe - Setor</option>
                                    <option value="2">Operacional</option>
                                    <option value="3">Administrativo</option>
                                    <option value="4">Funcionários</option>

                                </select>

                            </div>


                            <div class="  mb-2 mt-4">
                                <button type="submit" class=" botao-cadastro borda-cadastro w-100 py-2 fw-bold">
                                    Fazer Login
                                </button>
                            </div>
                        </form>

                        <div id="mensagem" class="text-center mt-3"></div>
                        <div class="toggle text-center mt-2" id="toggle"></div>

                    </div>
                </div>

            </div>
        </div>



    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/validacao-login.js"></script>
</body>


</html>
