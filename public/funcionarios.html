    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <title>Página Funcionários - EasyRail</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg p-2" id="navbar">
            <a class="navbar-brand" href="main.html">
                <img src="../assets/images/logo-navbar.png" alt="EasyRail Logo" width="45px" height="45px">
                EasyRail
            </a>
            <div class="collapse navbar-collapse d-flex justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item active">

                    <li class="nav-item">

                    </li>
                </ul>
            </div>
            <a class="navbar-brand" href="../index.html">Sair</a>
        </nav>
    </header>


    <h1 class="titulo-funcionarios fw-bold">Cadastro de Funcionário</h1>

    <main id="body-funcionarios" class="text-black">
        <div class="d-flex">
            <div class="col-10 col-md-4 col-lg-3 px-4">
                <div class="card borda-funcionarios shadow p-3">
                    <div class="card-body">
                        <form id="form-funcionarios" class="row g-3">
                            <h2 id="titulo" class="text-center fw-bold"></h2>

                            <div class="mb-2">
                                <label for="nome" class="form-label fw-bold ">Nome Usuário</label>
                                <input type="text" class="form-control borda-funcionarios" id="nome" value="Dig@ite o nome" required>
                            </div>

                            <div class="mb-2">
                                <label for="senha" class="form-label fw-bold">Email Institucional </label>
                                <input type="email" class="form-control borda-funcionarios" id="email" value="Digite@mail" required>
                            </div>

                            <div class="mb-2">
                                <label for="email" class="form-label fw-bold">Senha Funcionário</label>
                                <input type="password" class="form-control borda-funcionarios" id="senha" value="Digite a senha" required>
                            </div>

                            <div class="mb-2">
                                <label for="setor" class="form-label fw-bold">Setor</label>
                                <select name="Setor" class="form-control borda-funcionarios" id="setor" required>
                                    <option selected>Gestão</option>
                                    <option value="1">Chefe - Setor</option>
                                    <option value="2">Operacional</option>
                                    <option value="3">Administrativo</option>
                                    <option value="4">Funcionários</option>
                                </select>
                            </div>

                            <div class="mb-2 mt-4">
                                <button type="submit" class="botao-funcionarios borda-funcionarios w-100 py-2 fw-bold">
                                    Cadastrar
                                </button>
                            </div>
                        </form>

                        <div id="mensagem" class="text-center mt-3"></div>
                        <div class="toggle text-center mt-2" id="toggle"></div>

                    </div>
                </div>

            </div>

            <div class="container mt-4">
                <div class="card p-3 mb-4 shadow-sm">

                    <div class="row mb-4">

                        <div class="col-md-6">
                            <label>Pesquisar</label>
                            <input class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label>Atuação</label>
                            <select class="form-select">
                                <option>Todos</option>
                                <option>Gestão</option>
                                <option>Chefe - Setor</option>
                                <option>Operacional</option>
                                <option>Administrativo</option>
                                <option>Funcionários</option>
                            </select>
                        </div>

                    </div>
                </div>
                <div class="card p-3 mt-4">

                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Funcionário</th>
                                <th>Setor</th>
                                <th>Nome</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr id="1">
                                <td>#00001</td>
                                <td>Gestão</td>
                                <td>Caio Leite</td>
                                <td><button class="btn-editar" id="1">✏</button><button class="btn-excluir" id="1">🗑</button></td>
                            </tr>
                        </tbody>

                    </table>

                </div>
                </table>

            </div>




    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../scripts/funcionarios.js"></script>
</body>


</html>
