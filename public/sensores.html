<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
    <title>Página Sensores - EasyRail</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg p-2" id="navbar">
            <a class="navbar-brand" href="home.html">
                <img src="../assets/images/logo-navbar.png" alt="EasyRail Logo" width="45px" height="45px">
                EasyRail
            </a>
            <div class="collapse navbar-collapse d-flex justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item active"><a class="nav-link" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Frota de Carga</a></li>
                    <li class="nav-item"><a class="nav-link" href="sensores.html">Sensores IoT</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Relatórios</a></li>
                    <li class="nav-item"><a class="nav-link" href="funcionarios.html">Funcionários</a></li>
                </ul>
            </div>
            <a class="navbar-brand" href="../index.html">Sair</a>
        </nav>
    </header>

    <h1 class="titulo-pagina fw-bold">Cadastro de Sensores</h1>

    <main class="main-padrao">
        <div class="container-fluid">
            <div class="d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-laranja fw-bold p-2" data-bs-toggle="modal"
                    data-bs-target="#modalCadastro">
                    + Adicionar Sensor
                </button>
            </div>

            <div class="modal fade" id="modalCadastro" tabindex="-1" aria-labelledby="modalCadastroLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content text-start">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="modalCadastroLabel">Cadastrar Novo Sensor</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="form-sensor">
                                <div class="mb-3">
                                    <label for="id-sensor" class="form-label fw-bold">ID do Sensor</label>
                                    <input type="text" class="form-control" id="id-sensor" required>
                                </div>
                                <div class="mb-3">
                                    <label for="setor-sensor" class="form-label fw-bold">Localização</label>
                                    <input type="text" class="form-control" id="setor-sensor" required>
                                </div>
                                <div class="mb-3">
                                    <label for="nome-sensor" class="form-label fw-bold">Nome</label>
                                    <input type="text" class="form-control" id="nome-sensor" required>
                                </div>
                                <div class="mb-3">
                                    <label class="fw-bold form-label">Tipo</label>
                                    <select class="form-select">
                                        <option>Selecionar</option>
                                        <option>Temperatura</option>
                                        <option>Velocidade</option>
                                        <option>Energia</option>
                                    </select>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer justify-content-between">
                            <button type="button" class="btn btn-secondary fw-bold"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-laranja" id="btn-salvar">Salvar Sensor</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-3 mb-4 shadow-sm">
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label class="fw-bold form-label">Pesquisar</label>
                        <input class="form-control" placeholder="Modelo/ID">
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold form-label">Tipo</label>
                        <select class="form-select">
                            <option>Todos</option>
                            <option>Temperatura</option>
                            <option>Velocidade</option>
                            <option>Energia</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card p-3 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Responsável</th>
                                <th>Tipo</th>
                                <th>Localização</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>#00001</td>
                                <td>Sensor</td>
                                <td>Caio Leite</td>
                                <td>Temperatura</td>
                                <td>Xique-Xique</td>
                                <td>👁 ✏ 🗑</td>
                            </tr>
                            <tr>
                                <td>#00002</td>
                                <td>Sensor</td>
                                <td>Caio Leite</td>
                                <td>Temperatura</td>
                                <td>Xique-Xique</td>
                                <td>👁 ✏ 🗑</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/validacao-login.js"></script>
</body>

</html>
