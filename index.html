<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <title>EasyRail</title>
</head>

<body id="body-cadastro" class="h-100">
    <header>

    </header>



    <main id="main-cadastro" class="w-50 h-100">
    <img src="assets/images/negative-icon.png" class="deco-icon" alt="EasyRail icon">
        <div class="p-5 m-5">
            <div class="card-body p-5 m-5">
                <h2 style="font-size: 50px;">EASYRAIL</h2>
                <form id="form-login">

                    <div class="mt-3 mb-3">
                        <label for="nome">Nome de Usuário:</label>
                        <input class="form-control arredonda" type="text" id="usuario-login" required>
                    </div>

                    <div class="mt-3 mb-3">
                        <label for="senha">Senha:</label>
                        <input class="form-control arredonda" type="password" id="senha-login" required>
                    </div>

                    <div class="mt-3 mb-3">
                        <input type="checkbox">
                        <label>Mantenha-me logado</label><br>
                    </div>

                    <button class="btn w-100 arredonda" id="botao-envio" type="submit">Entrar</button>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
