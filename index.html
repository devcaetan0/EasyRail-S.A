<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <title>EasyRail</title>
</head>

<body id="body-index" class="">
    <header>

    </header>

    <main id="main-index" class="d-flex">
      <form action="" id="formulario" class="shadow p-3 mb-5 bg-dark-subtle rounded m-5 opacity-100 col-md-5">
        <div>
            <h1 class="text-center">EASYRAIL</h1>
            <p class="text-center">Preencha os dados abaixo para logar em sua conta no Fórum de Hearts of Iron IV</p>
        </div>

        <div>
            <div>
                <label for="">Username</label>
                <input type="text" class="form-control" aria-label="Username" aria-describedby="basic-addon1" id="usuario" >
            </div>
        </div>

        <div>
            <div>
                <label for="">Senha</label>
                <input type="password" class="form-control" aria-label="Username" aria-describedby="basic-addon1" id="senha">
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3 alignRight" id="submit">Fazer Login</button>
</form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
